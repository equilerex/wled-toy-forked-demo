[package]
name = "wledtoy"
version = "1.0.0"
description = "Shader playground that streams to WLED LED strips"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wledtoy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["json"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.5"
